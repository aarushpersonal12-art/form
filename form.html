<html>
    <head>
        <title>
            FORM
        </title>
    </head>
    <body>
        <h2>Personal Information</h2>
        <form>

             <p>Enter your first name:</p>
            
              <input type="text" name="first_name" placeholder="Enter your name" size="30"><br><br>
             <p>Enter your second name:

             </p>  <input type="text" name="last_name" placeholder="Enter your name" size="30"><br><br>
             <p>Enter your birth of date:

             </p> <input type="date" name="Date_of_birth"  placeholder="Select your date of birth" size="30"><br><br>
             
             <p>Enter your email:</p>
              <input type="email"  name="email" placeholder="Enter your Email" size="30"><br><br>

            <p>Select your hobbies:</p>

    <input type="checkbox" name="hobby" value="football"> Football
    <input type="checkbox" name="hobby" value="music"> Music
    <input type="checkbox" name="hobby" value="reading"> Reading

      <p>Select your gender:</p>

    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other

     <p>Select your country:</p>

    <select name="country">
        <option value="nepal">Nepal</option>
        <option value="india">India</option>
        <option value="usa">USA</option>
        <option value="uk">UK</option>
    </select>

        </form>
    </body>
</html>
